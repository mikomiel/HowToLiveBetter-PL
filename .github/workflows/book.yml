# Polskie wydanie: tylko walidacja. Bez e-booków, wydań, tagów i wdrożeń.
name: Kontrole polskiego wydania

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pilot-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pilot:
    name: Treść i czytnik
    # Keep the runner compatible with the pinned Playwright browser builds.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run lint:content
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
