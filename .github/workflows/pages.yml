# Polskie wydanie: ręczna publikacja strony czytnika w GitHub Pages. Bez automatycznego wdrożenia. Publikuje wyłącznie pliki z tools/pl/build-site.mjs.
# Warunek `if` poniżej działa tylko w pliku z gałęzi, z której uruchomiono workflow. Granicą dla main jest reguła środowiska github-pages
# (Settings, Environments, github-pages, Deployment branches: tylko main), którą ustawia właściciel. Pozostałe workflowy tylko walidują.
name: Publikacja strony czytnika

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Budowa strony
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node tools/pl/build-site.mjs _site
      - run: npx playwright install --with-deps chromium
      - run: SITE_DIR=_site npx playwright test tests/browser/site.spec.mjs --project=desktop
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Wdrożenie
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
