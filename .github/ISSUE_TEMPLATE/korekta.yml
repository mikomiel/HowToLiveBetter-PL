name: Korekta polskiego wydania
description: Błąd w treści, źródle, tłumaczeniu lub czytniku
title: "Korekta 04.N: "
body:
  - type: input
    id: item
    attributes:
      label: Identyfikator porady lub miejsce błędu
      placeholder: "04.12 albo wyszukiwanie w czytniku"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Co wymaga poprawy?
      description: Przytocz zdanie lub opisz kroki odtworzenia błędu. Nie podawaj danych osobowych.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Źródło i proponowana korekta
      description: Podaj badanie pierwotne lub oficjalny dokument. Jeżeli źródła brakuje, napisz to wprost.
    validations:
      required: false
